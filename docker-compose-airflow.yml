services:
  postgres:
    image: postgres:15
    container_name: airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data

  airflow:
    image: retail-airflow:latest
    container_name: airflow_standalone
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PROJECT_ROOT: /opt/airflow/retail_pipeline
    ports:
      - "8080:8080"
    volumes:
      - D:\retail_pipeline:/opt/airflow/retail_pipeline 
      - D:\retail_pipeline\airflow\dags:/opt/airflow/dags 
      - D:\retail_pipeline\airflow\logs:/opt/airflow/logs 
    command: > 
      bash -c "airflow db migrate && 
               airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com && 
               airflow webserver & airflow scheduler & wait" 
               
volumes: 
  airflow_pg_data:              