<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  text { font-family: Arial, Helvetica, sans-serif; }
  .title { font-size: 15px; font-weight: 600; fill: #1a1a1a; }
  .sub { font-size: 11px; fill: #444; }
  .box { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1.2; rx: 8; }
  .boxAlt { fill: #FAECE7; stroke: #993C1D; stroke-width: 1.2; rx: 8; }
  .boxGray { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 1.2; rx: 8; }
  .arrow { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
  .label { font-size: 11px; fill: #333; }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
  </marker>
</defs>

<text x="20" y="25" class="title" font-size="17">Smart Retail Analytics Pipeline — Architecture</text>

<!-- Batch pipeline row -->
<text x="20" y="60" class="sub">Batch pipeline (Medallion architecture)</text>

<rect x="20" y="70" width="80" height="50" class="boxGray"/>
<text x="60" y="90" class="sub" text-anchor="middle">Online Retail</text>
<text x="60" y="104" class="sub" text-anchor="middle">II (Kaggle CSV)</text>

<path d="M100,95 L140,95" class="arrow"/>

<rect x="140" y="70" width="110" height="50" class="box"/>
<text x="195" y="90" class="title" font-size="13" text-anchor="middle">Bronze</text>
<text x="195" y="106" class="sub" text-anchor="middle">1.07M raw rows</text>

<path d="M250,95 L290,95" class="arrow"/>

<rect x="290" y="70" width="110" height="50" class="box"/>
<text x="345" y="90" class="title" font-size="13" text-anchor="middle">Silver</text>
<text x="345" y="106" class="sub" text-anchor="middle">1.03M cleaned</text>

<path d="M400,95 L440,95" class="arrow"/>

<rect x="440" y="70" width="120" height="50" class="box"/>
<text x="500" y="90" class="title" font-size="13" text-anchor="middle">Anomaly Detection</text>
<text x="500" y="106" class="sub" text-anchor="middle">537K scored (Isolation Forest)</text>

<path d="M560,95 L600,95" class="arrow"/>

<rect x="600" y="70" width="130" height="50" class="box"/>
<text x="665" y="90" class="title" font-size="13" text-anchor="middle">Gold</text>
<text x="665" y="106" class="sub" text-anchor="middle">3 report tables</text>

<path d="M665,120 L665,150" class="arrow"/>
<rect x="580" y="150" width="170" height="40" class="boxGray"/>
<text x="665" y="175" class="sub" text-anchor="middle">Orchestrated via Airflow (daily)</text>

<path d="M665,190 L665,215" class="arrow"/>
<rect x="580" y="215" width="170" height="40" class="boxAlt"/>
<text x="665" y="240" class="sub" text-anchor="middle">Text-to-SQL RAG agent</text>

<!-- Streaming pipeline row -->
<text x="20" y="300" class="sub">Streaming pipeline (parallel)</text>

<rect x="20" y="310" width="110" height="50" class="boxGray"/>
<text x="75" y="330" class="sub" text-anchor="middle">Silver (1 month</text>
<text x="75" y="344" class="sub" text-anchor="middle">sample, 83K rows)</text>

<path d="M130,335 L170,335" class="arrow"/>

<rect x="170" y="310" width="120" height="50" class="boxAlt"/>
<text x="230" y="330" class="title" font-size="13" text-anchor="middle">Producer</text>
<text x="230" y="346" class="sub" text-anchor="middle">Paced replay, timestamp-scaled</text>

<path d="M290,335 L330,335" class="arrow"/>

<rect x="330" y="310" width="120" height="50" class="box"/>
<text x="390" y="330" class="title" font-size="13" text-anchor="middle">Kafka</text>
<text x="390" y="346" class="sub" text-anchor="middle">retail-transactions (3 partitions)</text>

<path d="M450,335 L490,335" class="arrow"/>

<rect x="490" y="310" width="150" height="50" class="boxAlt"/>
<text x="565" y="328" class="title" font-size="13" text-anchor="middle">Spark Structured</text>
<text x="565" y="344" class="sub" text-anchor="middle">Streaming consumer</text>

<path d="M640,335 L680,335" class="arrow"/>

<rect x="680" y="310" width="130" height="50" class="box"/>
<text x="745" y="328" class="title" font-size="13" text-anchor="middle">streaming_bronze</text>
<text x="745" y="344" class="sub" text-anchor="middle">Idempotent MERGE</text>

<!-- Infra row -->
<text x="20" y="420" class="sub">Infrastructure</text>
<rect x="20" y="430" width="200" height="40" class="boxGray"/>
<text x="120" y="455" class="sub" text-anchor="middle">Docker (Kafka broker, KRaft mode)</text>

<rect x="240" y="430" width="260" height="40" class="boxGray"/>
<text x="370" y="455" class="sub" text-anchor="middle">Docker (custom Airflow image: Java 17 + PySpark 3.5.1 + Delta 3.2.0)</text>

<rect x="520" y="430" width="200" height="40" class="boxGray"/>
<text x="620" y="455" class="sub" text-anchor="middle">Delta Lake (local filesystem)</text>

<text x="20" y="500" class="sub" font-style="italic">Tested with pytest + chispa (Silver and Gold transformation logic)</text>
</svg>
